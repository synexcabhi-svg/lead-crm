name: Keep-alive ping

# Pings the deployed health endpoint so the serverless functions and the
# auto-suspending database stay warm. Runs every 10 minutes.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://lead-crm-theta-hazel.vercel.app/api/health") || code=000
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "health check did not return 200"
          exit 1
